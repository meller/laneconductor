      - article [ref=e55]:
        - generic [ref=e56]:
          - generic [ref=e58]:
            - link [ref=e59] [cursor=pointer]:
              - /url: https://de.linkedin.com/in/asaf-meller-a59786?trk=public_post_feed-actor-image
              - img [ref=e60]
            - generic [ref=e61]:
              - link [ref=e63] [cursor=pointer]:
                - /url: https://de.linkedin.com/in/asaf-meller-a59786?trk=public_post_feed-actor-name
                - text: Asaf Meller
              - time [ref=e65]: 6h
          - button [ref=e68] [cursor=pointer]
        - paragraph [ref=e70]:
          - text: "I've been building education AI projects for the last year using Claude Code and Gemini CLI. Three things kept slowing me down: context limits forcing agent restarts mid-task, switching between agents and losing the thread entirely, and repeating the same requirements over and over. The LLM remembered the code — but not why it was built that way. Every new session I'd find myself re-explaining decisions that were already made. I found superpowers and gemini conductor. Both good, but halfway there — neither gave me the Kanban lanes I was used to. A Kanban card isn't just a UI preference; it's a structure that forces you to define status, progress, and next steps — exactly the context an agent needs to pick up without re-explanation. So I built LaneConductor. Every task is a folder. The agent opens it, knows exactly what it's building, why, and where the last session stopped. It does its work, writes back. Context limit? Restart. Switch to Gemini. Doesn't matter — the next agent picks up the same folder and continues. No briefing. No repetition. The part I find most valuable: the agent has the product intent, not just the code. I work on a design, turn it into code, and the design lives in the same task folder. Next time I touch that area, we load the spec, update if needed, change the code accordingly. The agent understands why the code is the way it is. If you're already in Jira, it syncs both ways. --- Where this is going: the same pattern extends beyond dev — marketing, sales, support — any AI work that needs persistent context. Inspired by Karpathy's autoresearch idea: define success before execution, measure at the end of a time window, feed failures back into planning. The system learns from what didn't work. Start with the skill file — drop it into Claude Desktop, 30 seconds, no deps. If you like it, add the full UI or connect your Jira."
          - link [ref=e71] [cursor=pointer]:
            - /url: https://www.linkedin.com/redir/redirect?url=https%3A%2F%2Flnkd%2Ein%2FdhP7bHMP&urlhash=dY5l&trk=public_post-text
            - text: https://lnkd.in/dhP7bHMP
          - text: Curious what you're building and whether persistent context changes how you work with agents.
