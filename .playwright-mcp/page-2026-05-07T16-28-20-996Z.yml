                  - generic [ref=e190]:
                    - text: "I've been building education AI projects for the last year using Claude Code and Gemini CLI. Three things kept slowing me down: context limits forcing agent restarts mid-task, switching between agents and losing the thread entirely, and repeating the same requirements over and over. The LLM remembered the code — but not why it was built that way. Every new session I'd find myself re-explaining decisions that were already made."
                    - text: I found superpowers and gemini conductor. Both good, but halfway there — neither gave me the Kanban lanes I was used to. A Kanban card isn't just a UI preference; it's a structure that forces you to define status, progress, and next steps — exactly the context an agent needs to pick up without re-explanation.
                    - text: So I built LaneConductor.
                    - text: Every task is a folder. The agent opens it, knows exactly what it's building, why, and where the last session stopped. It does its work, writes back. Context limit? Restart. Switch to Gemini. Doesn't matter — the next agent picks up the same folder and continues. No briefing. No repetition.
                    - text: "The part I find most valuable: the agent has the product intent, not just the code. I work on a design, turn it into code, and the design lives in the same task folder. Next time I touch that area, we load the spec, update if needed, change the code accordingly. The agent understands why the code is the way it is."
                    - text: If you're already in Jira, it syncs both ways.
                    - text: "---"
                    - text: "Where this is going: the same pattern extends beyond dev — marketing, sales, support — any AI work that needs persistent context. Inspired by Karpathy's autoresearch idea: define success before execution, measure at the end of a time window, feed failures back into planning. The system learns from what didn't work."
                    - text: Start with the skill file — drop it into Claude Desktop, 30 seconds, no deps. If you like it, add the full UI or connect your Jira.
                    - link "https://lnkd.in/dhP7bHMP" [ref=e191] [cursor=pointer]:
                      - /url: https://lnkd.in/dhP7bHMP
                    - text: Curious what you're building and whether persistent context changes how you work with agents.
