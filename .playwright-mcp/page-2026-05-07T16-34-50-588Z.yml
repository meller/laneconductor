                    - text: as the source of truth, enabling agents and humans to coordinate seamlessly.
                  - listitem [ref=e742]:
                    - strong [ref=e743]: Live Kanban Dashboard
                    - text: ": A Vite + React dashboard that syncs in real-time with your filesystem via a local Postgres database."
                  - listitem [ref=e744]:
                    - strong [ref=e745]: Quality Gates
                    - text: ": Automated verification (tests, linting, builds) that must pass before any work is considered \"Done\"."
