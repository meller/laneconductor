                    - list [ref=e729]:
                      - listitem [ref=e730]:
                        - strong [ref=e731]: Local-First
                        - text: ": Runs 100% on your hardware via local SQLite/Postgres. Zero cloud, zero cost."
                      - listitem [ref=e732]:
                        - strong [ref=e733]: Remote / Team Mode
                        - text: ": Scales to production via Google Cloud Functions and"
                        - strong [ref=e734]: Neon Postgres
                        - text: ", enabling shared visibility for distributed teams."
                  - listitem [ref=e735]:
                    - strong [ref=e736]: The Conductor Pattern
                    - text: ": A structured"
                    - strong [ref=e737]: Plan → Implement → Review → Quality Gate → Done
                    - text: pipeline. Compatible with the
                    - link "Gemini CLI conductor format" [ref=e738] [cursor=pointer]:
