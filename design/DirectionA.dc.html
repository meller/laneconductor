<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #030712;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #60a5fa; } a:hover { color: #93c5fd; }
    .bar { background: #1f2937; border-radius: 2px; display: block; }
    .box { border: 1px solid #374151; background: #111827; border-radius: 6px; }
  </style>
</helmet>

<div style="width:375px;height:812px;background:#030712;display:flex;flex-direction:column;overflow:hidden;">

  <!-- Direction label -->
  <div style="flex-shrink:0;padding:16px;border-bottom:1px dashed #374151;display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:10px;font-weight:700;letter-spacing:.12em;color:#6b7280;">DIRECTION A</span>
      <span style="height:1px;flex:1;background:#374151;display:block;"></span>
    </div>
    <p style="margin:0;font-size:17px;font-weight:700;color:#e5e7eb;font-family:ui-sans-serif,system-ui,sans-serif;">Lane at a time</p>
    <p style="margin:0;font-size:11px;color:#9ca3af;line-height:1.5;font-family:ui-sans-serif,system-ui,sans-serif;">Keeps the Kanban model intact — one full-width lane per screen, swipe sideways between them.</p>
    <p style="margin:2px 0 0 0;font-size:11px;color:#6b7280;line-height:1.5;font-family:ui-sans-serif,system-ui,sans-serif;"><span style="color:#fbbf24;">Trade-off:</span> you never see the whole pipeline at once — comparing lanes always costs a swipe.</p>
  </div>

  <!-- Wireframe -->
  <div style="flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;">

    <!-- top bar -->
    <div class="box" style="height:38px;display:flex;align-items:center;padding:0 11px;gap:8px;">
      <span class="bar" style="width:74px;height:8px;"></span>
      <span style="flex:1;"></span>
      <span class="bar" style="width:16px;height:16px;border-radius:9999px;"></span>
      <span class="bar" style="width:16px;height:16px;border-radius:9999px;"></span>
    </div>

    <!-- lane rail -->
    <div style="display:flex;gap:6px;align-items:flex-end;">
      <div style="flex-shrink:0;padding:7px 9px;border-bottom:2px solid #374151;"><span style="font-size:10px;color:#4b5563;">Backlog</span></div>
      <div style="flex-shrink:0;padding:7px 9px;border-bottom:2px solid #6366f1;"><span style="font-size:10px;color:#818cf8;font-weight:700;">Plan 18</span></div>
      <div style="flex-shrink:0;padding:7px 9px;border-bottom:2px solid #374151;"><span style="font-size:10px;color:#4b5563;">Impl</span></div>
      <div style="flex-shrink:0;padding:7px 9px;border-bottom:2px solid #374151;"><span style="font-size:10px;color:#4b5563;">Review</span></div>
      <div style="flex-shrink:0;padding:7px 9px;border-bottom:2px solid #374151;"><span style="font-size:10px;color:#4b5563;">QG</span></div>
      <div style="flex-shrink:0;padding:7px 9px;border-bottom:2px solid #374151;"><span style="font-size:10px;color:#4b5563;">Done</span></div>
    </div>

    <!-- swipe hint -->
    <div style="display:flex;align-items:center;justify-content:center;gap:9px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span style="font-size:9px;color:#4b5563;letter-spacing:.08em;">SWIPE BETWEEN LANES</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>

    <!-- cards -->
    <div class="box" style="border-color:#4338ca;padding:11px;display:flex;flex-direction:column;gap:8px;">
      <span class="bar" style="width:52px;height:7px;"></span>
      <span class="bar" style="width:100%;height:9px;background:#374151;"></span>
      <span class="bar" style="width:66%;height:9px;background:#374151;"></span>
      <span class="bar" style="width:100%;height:5px;border-radius:9999px;"></span>
    </div>
    <div class="box" style="border-color:#4338ca;padding:11px;display:flex;flex-direction:column;gap:8px;">
      <span class="bar" style="width:52px;height:7px;"></span>
      <span class="bar" style="width:88%;height:9px;background:#374151;"></span>
      <span class="bar" style="width:100%;height:5px;border-radius:9999px;"></span>
    </div>
    <div class="box" style="border-color:#4338ca;padding:11px;display:flex;flex-direction:column;gap:8px;">
      <span class="bar" style="width:52px;height:7px;"></span>
      <span class="bar" style="width:94%;height:9px;background:#374151;"></span>
      <span class="bar" style="width:40%;height:9px;background:#374151;"></span>
      <span class="bar" style="width:100%;height:5px;border-radius:9999px;"></span>
    </div>
    <div class="box" style="border-color:#4338ca;padding:11px;display:flex;flex-direction:column;gap:8px;opacity:.5;">
      <span class="bar" style="width:52px;height:7px;"></span>
      <span class="bar" style="width:72%;height:9px;background:#374151;"></span>
      <span class="bar" style="width:100%;height:5px;border-radius:9999px;"></span>
    </div>

  </div>

  <!-- tabs -->
  <div style="flex-shrink:0;height:56px;border-top:1px solid #1f2937;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));">
    <div style="display:flex;align-items:center;justify-content:center;"><span class="bar" style="width:26px;height:7px;"></span></div>
    <div style="display:flex;align-items:center;justify-content:center;"><span class="bar" style="width:26px;height:7px;background:#6366f1;"></span></div>
    <div style="display:flex;align-items:center;justify-content:center;"><span class="bar" style="width:26px;height:7px;"></span></div>
    <div style="display:flex;align-items:center;justify-content:center;"><span class="bar" style="width:26px;height:7px;"></span></div>
  </div>

</div>
</x-dc>
</body>
</html>
